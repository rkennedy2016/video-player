<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Manual PiP</title>
<style>
  body { margin: 0; background: #000; }
  video { width: 100%; height: auto; }
  #pipButton {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 12px 18px;
    background: white;
    border-radius: 8px;
    font-size: 16px;
    border: none;
  }
</style>
</head>
<body>

<video id="v" playsinline controls></video>
<button id="pipButton">Enter PiP</button>

<script>
  const params = new URLSearchParams(location.search);
  const urlParam = params.get("url");
  const v = document.getElementById("v");

  if (urlParam) {
    v.src = urlParam;
  }

  document.getElementById("pipButton").onclick = async () => {
    try {
      await v.requestPictureInPicture();
    } catch (e) {
      console.log(e);
    }
  };
</script>

</body>
</html>
